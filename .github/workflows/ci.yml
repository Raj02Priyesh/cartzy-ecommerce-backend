name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway values for the CI database only - not real secrets.
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/cartzy-ci
      JWT_SECRET: ci-only-jwt-secret
      ADMIN_KEY: ci-only-admin-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Seed demo data
        run: npm run seed

      - name: Start API server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q "MongoDB Connected" server.log; then echo "Server is up"; exit 0; fi
            sleep 1
          done
          echo "Server did not start in time"; cat server.log; exit 1

      - name: Run smoke test
        run: npm run test:smoke

      - name: Server log (on failure)
        if: failure()
        run: cat server.log
